# Shared supervisord configuration for both Docker image variants.
# The single-container image appends supervisord.surrealdb.conf to this file
# at build time (see the `single` stage in the Dockerfile).

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# T3 governor: local-only control socket so the API-side governor can
# stop/start the worker program. No inet listener; file perms default.
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
command=uv run --no-sync uvicorn api.main:app --host %(ENV_API_HOST)s --port 5055
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10
autostart=true
startsecs=3

[program:worker]
; A separate script, not an inline sh -c. supervisord parses this file
; with ExtendedInterpolation, which expands $VAR/${VAR} in command=
; before any shell runs, so a shell variable assigned earlier in the
; same command is not protected from it. scripts/worker-launch.sh owns
; the precedence rules (throttle.env over the environment), the
; platform cap, and writing throttle.running for the API to report.
command=/app/scripts/worker-launch.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20
autostart=true
startsecs=3
; T3 graceful stop: SIGTERM abandons in-flight jobs (abandon-to-stale
; contract); 30s lets finally/hb.stop() blocks settle before SIGKILL.
; Full-app stop order is compose-down dependents-first (media, worker/api,
; surrealdb last via depends_on); the API governor only sleeps the worker.
stopwaitsecs=30

[program:frontend]
; HOSTNAME must be forced here: container runtimes inject HOSTNAME=<container/pod
; hostname> at runtime (Podman pods override the image's ENV HOSTNAME=0.0.0.0),
; making Next.js bind to the wrong address (#994). Override with FRONTEND_BIND_HOST.
command=bash -c "/app/scripts/wait-for-api.sh && HOSTNAME=${FRONTEND_BIND_HOST:-0.0.0.0} node server.js"
directory=/app/frontend
environment=NODE_ENV="production",PORT="8502"
passenv=API_URL,NEXT_PUBLIC_API_URL,INTERNAL_API_URL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=30
autostart=true
startsecs=10
