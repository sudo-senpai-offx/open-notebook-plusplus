services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:-root}", "--pass", "${SURREAL_PASSWORD:-root}", "rocksdb:/mydata/mydatabase.db"]
    user: root
    ports:
      - "127.0.0.1:8108:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  open_notebook:
    build: .
    ports:
      - "8502:8502"
      - "5055:5055"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      # - OPEN_NOTEBOOK_ENABLE_DOCLING=true  # disabled by default for low-end
      - OPEN_NOTEBOOK_WORKER_MAX_TASKS=1
      - OPEN_NOTEBOOK_FORCE_MINI_MODELS=true
      - OPEN_NOTEBOOK_MINI_MODEL_CHAT=mistral-nemo:latest
      - OPEN_NOTEBOOK_MINI_MODEL_EMBED=nomic-embed-text:latest
      - OPEN_NOTEBOOK_MINI_MODEL_TRANSFORM=llama3.2:3b-instruct-q4_0
      - OPEN_NOTEBOOK_DOCLING_FAST_PROFILE=true
    volumes:
      - ./notebook_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - surrealdb
    restart: always
    pull_policy: always

  whisper:
    build: ../whisper.cpp
    image: whisper.cpp:local
    command: ["./build/bin/whisper-server", "--model", "/app/models/ggml-large-v3-turbo-q5_0.bin", "--host", "0.0.0.0", "--port", "9000", "--inference-path", "/v1/audio/transcriptions"]
    ports:
      - "9000:9000"
    volumes:
      - ../whisper_models:/app/models
    profiles: ["media"]
    restart: always

  piper:
    build: /home/dev-sudo-senpai/piper
    image: piper:local
    profiles: ["media"]
    ports:
      - "9600:9600"
    volumes:
      - ~/piper_models:/app/models
    restart: always

  piper-ja:
    build: /home/dev-sudo-senpai/piper-ja
    image: piper-ja:local
    profiles: ["media"]
    ports:
      - "9601:9601"
    volumes:
      - ~/piper_models:/app/models
    restart: always
