services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:-root}", "--pass", "${SURREAL_PASSWORD:-root}", "rocksdb:/mydata/mydatabase.db"]
    user: root
    ports:
      - "127.0.0.1:8108:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
      # B4 low-memory envelope (512MiB/1c): raw byte counts only — v2
      # silently ignores MiB suffixes. HNSW default alone is 256MiB.
      - SURREAL_ROCKSDB_BLOCK_CACHE_SIZE=33554432
      - SURREAL_ROCKSDB_MAX_OPEN_FILES=256
      - SURREAL_HNSW_CACHE_SIZE=33554432
      - SURREAL_ROCKSDB_WRITE_BUFFER_SIZE=16777216
      - SURREAL_ROCKSDB_MAX_WRITE_BUFFER_NUMBER=2
      - SURREAL_ROCKSDB_MIN_WRITE_BUFFER_NUMBER_TO_MERGE=2
      - SURREAL_ROCKSDB_JOBS_COUNT=2
      - SURREAL_ROCKSDB_THREAD_COUNT=1
    restart: always
    pull_policy: always

  open_notebook:
    build: .
    ports:
      - "8502:8502"
      # Loopback, deliberately. This port was published on every
      # interface, which is how it was verified reachable from the LAN
      # address and answering a cross-origin preflight with
      # `access-control-allow-origin: *`. Nothing outside this machine
      # needs it: the browser reaches the API through the Next.js proxy
      # on 8502, and the phone is reached over `adb forward`, which
      # connects to the device's own loopback.
      - "127.0.0.1:5055:5055"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      # - OPEN_NOTEBOOK_ENABLE_DOCLING=true  # disabled by default for low-end
      # Worker concurrency. 1 is the safe default for constrained
      # devices (phone stays here: thermal limits and the OOM lesson);
      # raise per device in .env where cores and RAM allow - the PC runs
      # 3 (12 cores, CPU-bound inference, measured against thrashing).
      - OPEN_NOTEBOOK_WORKER_MAX_TASKS=${OPEN_NOTEBOOK_WORKER_MAX_TASKS:-1}
      # How much of the model's context one part of a long document may occupy.
      # The default suits a 4096-token window; a device that gives the model more
      # should raise it, because every extra part is another generation call and
      # generation is what costs.
      - OPEN_NOTEBOOK_TRANSFORMATION_CHUNK_TOKENS=${OPEN_NOTEBOOK_TRANSFORMATION_CHUNK_TOKENS:-3000}
      # How long one LLM call may take.
      #
      # Sixty seconds is esperanto's default and it is not a *total* timeout -
      # httpx applies it per read, so a streamed generation can run for many
      # minutes without tripping it. What it does bound is the wait for the
      # *first* token, which is the prompt evaluation. On this hardware a
      # 6,750-token prompt takes about eighty seconds to evaluate, so the
      # default expired before the model said anything and the failure was
      # classified as a network error - "Could not connect to the AI provider" -
      # which sent the investigation after connections that were working.
      #
      # It has to cover the prompt evaluation *and* the generation, so it is
      # generous. A prompt that cannot be evaluated inside this window is a
      # prompt the device cannot answer, and a timeout that says so is better
      # than one that says the network is down.
      - ESPERANTO_LLM_TIMEOUT=${ESPERANTO_LLM_TIMEOUT:-1800}
      # Without this the blob endpoints refuse everything: check_token
      # fails closed when no token is configured, so file bytes can
      # never move. The value comes from .env, where the sync token
      # already lives - it just never reached the container.
      - OPEN_NOTEBOOK_SYNC_TOKEN=${OPEN_NOTEBOOK_SYNC_TOKEN:-}
      # Auth on, with a real credential. It was previously configured
      # but unset, and PasswordAuthMiddleware short-circuits when no
      # password exists - so a request from the LAN address was
      # rejected for its malformed body rather than for having no
      # credentials at all. The frontend already has a login flow
      # (auth store, /login, /auth/status), so this needs no UI work.
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:-}
      - OPEN_NOTEBOOK_REQUIRE_AUTH=${OPEN_NOTEBOOK_REQUIRE_AUTH:-true}
      # Not `*`. The browser reaches the API through the Next.js proxy,
      # so the normal flow is same-origin and needs no CORS grant at
      # all; the wildcard only ever widened who could drive this API
      # from a page in any browser on the network.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:8502,http://localhost:8502}
      # Where the *models* live, in bytes, for the admission gate's ceiling
      # check. Ollama runs on the host (host.docker.internal), not in this
      # container - and Docker Desktop virtualises /proc, so the container
      # sees the VM's ~3.5 GB rather than the host's ~15 GB. Comparing a
      # host-resident 5 GB model against a 3.5 GB ceiling holds every
      # generation job forever, which is exactly what happened before this
      # was split out.
      #
      # Leave empty where the models are local (the phone runs llama-server
      # inside the guest beside the worker, so /proc is already correct) and
      # the gate falls back to its own MemTotal.
      - OPEN_NOTEBOOK_MODEL_POOL_BYTES=${OPEN_NOTEBOOK_MODEL_POOL_BYTES:-}
      - OPEN_NOTEBOOK_FORCE_MINI_MODELS=true
      # Interpolated from .env rather than hardcoded. The literal values
      # this replaced named three models that are not installed on this
      # machine and that Ollama cannot pull (auto-pull is off), so every
      # forced-mini provision 404'd, retried with backoff, and the queue
      # never drained. Hardcoding them also made .env a fiction: the
      # operator could edit the models there all day and compose would
      # ignore it.
      - OPEN_NOTEBOOK_MINI_MODEL_CHAT=${OPEN_NOTEBOOK_MINI_MODEL_CHAT:-qwen3:4b}
      - OPEN_NOTEBOOK_MINI_MODEL_EMBED=${OPEN_NOTEBOOK_MINI_MODEL_EMBED:-bge-m3:latest}
      - OPEN_NOTEBOOK_MINI_MODEL_TRANSFORM=${OPEN_NOTEBOOK_MINI_MODEL_TRANSFORM:-qwen3:4b}
      - OPEN_NOTEBOOK_DOCLING_FAST_PROFILE=true
      - OPEN_NOTEBOOK_EMBEDDING_BATCH_SIZE=8
    volumes:
      - ./notebook_data:/app/data
      # The sync manifest has to be readable by git on the host. Without
      # this the API writes it to /app/sync *inside the container*, which
      # no sync driver on the host can see - the export appears to
      # succeed and produces nothing to commit.
      - ./sync:/app/sync
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - surrealdb
    restart: always
    pull_policy: always

  whisper:
    build: ../whisper.cpp
    image: whisper.cpp:local
    command: ["./build/bin/whisper-server", "--model", "/app/models/${WHISPER_MODEL_FILE:-ggml-base.en-q5_1.bin}", "--host", "0.0.0.0", "--port", "9000", "--inference-path", "/v1/audio/transcriptions"]
    ports:
      - "9000:9000"
    volumes:
      # Overridable for SD-card bulk storage (hot models stay internal).
      - ${WHISPER_MODELS_DIR:-../whisper_models}:/app/models
    profiles: ["media"]
    restart: always

  piper:
    build: /home/dev-sudo-senpai/piper
    image: piper:local
    profiles: ["media"]
    ports:
      - "9600:9600"
    volumes:
      - ~/piper_models:/app/models
    restart: always

  piper-ja:
    build: /home/dev-sudo-senpai/piper-ja
    image: piper-ja:local
    profiles: ["media"]
    ports:
      - "9601:9601"
    volumes:
      - ~/piper_models:/app/models
    restart: always
