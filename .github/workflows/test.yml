name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/claude*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=open_notebook --cov=api --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage.xml

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check .

  backend-typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run python -m mypy .

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  resource-envelope:
    name: Resource Envelope (optional, non-gating)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 30
    env:
      MEASURE_SURREAL_ADDRESS: 127.0.0.1
      MEASURE_SURREAL_PORT: '8000'
      OLLAMA_API_BASE: http://127.0.0.1:11434
    services:
      surrealdb:
        image: surrealdb/surrealdb:v2
        command: start --bind 0.0.0.0:8000
        env:
          SURREAL_USER: root
          SURREAL_PASS: root
        ports:
          - 8000:8000
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Write .env for spawned processes
        run: |
          printf 'SURREAL_USER=root\nSURREAL_PASSWORD=root\nOPEN_NOTEBOOK_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" > .env
          cat .env

      - name: Wait for SurrealDB
        run: |
          for i in $(seq 1 30); do
            if curl -sf -m 2 "http://127.0.0.1:8000/health" >/dev/null 2>&1; then
              echo "SurrealDB healthy after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "SurrealDB did not become healthy" >&2
          exit 1

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            if curl -sf -m 2 "http://127.0.0.1:11434/api/tags" >/dev/null 2>&1; then
              echo "Ollama ready after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not become ready" >&2
          exit 1

      - name: Pull bge-m3 embedding model
        run: |
          docker exec "${{ job.services.ollama.id }}" ollama pull bge-m3
          curl -sf -m 2 "http://127.0.0.1:11434/api/tags" -o /dev/null
          echo "bge-m3 available"

      - name: Seed embedding model + default into SurrealDB
        run: |
          printf "CREATE model:ci_bge_m3 CONTENT { name: 'bge-m3', provider: 'ollama', type: 'embedding' };\nUPSERT open_notebook:default_models CONTENT { default_embedding_model: 'model:ci_bge_m3' };\n" | docker exec -i "${{ job.services.surrealdb.id }}" /surreal sql \
            --endpoint "http://127.0.0.1:8000" \
            --username root --password root \
            --namespace open_notebook --database open_notebook
          echo "Seeded model + defaults"

      - name: Run resource harness (spawn + smoke)
        run: bash scripts/measure_resources.sh
